<div *ngIf="!isAuthenticated" class="login-container mt-24">
  <div class="flex flex-col items-center justify-center gap-4 ">
    <h2>This is Admin page. Please login to continue!</h2>
    <p-button [raised]="true" class="font-semibold" size="large" label="Login now" icon="pi pi-sign-in"
      (onClick)="login()" />
  </div>

</div>

<div *ngIf="isAuthenticated" class="layout-wrapper" [ngClass]="containerClass">

        <app-loading></app-loading>
        <router-outlet></router-outlet>
      </div>
    </div>
    <div class="layout-mask animate-fadein"></div>
  </div> -->
  @if(role === 'user'){
  <div class="layout-main">
    <app-loading></app-loading>
    <router-outlet></router-outlet>
  </div>
  }@else {
  <app-top-bar></app-top-bar>
  <app-side-bar></app-side-bar>
  <div class="layout-main-container">
    <div class="layout-main">
      <app-loading></app-loading>
      <router-outlet></router-outlet>
    </div>
  </div>
  <div class="layout-mask animate-fadein"></div>
  }
  <p-scrolltop target="window" [threshold]="100" icon="pi pi-arrow-up"

</div>
