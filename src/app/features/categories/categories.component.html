<div class="card">
    <div class="font-semibold text-xl mb-4 flex justify-between items-center">
        <p>List Category</p>
        <div>
            <p-button (click)="showDialog()" label="+ Create new category" />
        </div>
    </div>
    <p-table #dt1 [value]="categories" dataKey="id" [rows]="10" [rowHover]="true" [showGridlines]="true"
        [paginator]="true" [globalFilterFields]="['name', 'productCount', 'updatedDate']" responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                    (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Search keyword" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="min-width: 12rem" pSortableColumn="name">
                    <div class="flex justify-between items-center">
                        <span><p-sortIcon field="name" /> Name</span>
                        <p-columnFilter type="text" field="name" display="menu"
                            placeholder="Search by name"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Product Count
                        <p-columnFilter type="number" field="productCount" display="menu"
                            placeholder="Search by product count"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Status
                        <p-columnFilter field="isActived" matchMode="equals" display="menu">
                            <ng-template #filter let-value let-filter="filterCallback">
                                <p-select [ngModel]="value" [options]="statuses" (onChange)="filter($event.value)"
                                    placeholder="Any" [style]="{ 'min-width': '12rem' }">
                                    <ng-template let-option #item>
                                        <span [class]="'customer-badge status-' + option.value">{{ option.label
                                            }}</span>
                                    </ng-template>
                                </p-select>
                            </ng-template>
                        </p-columnFilter>
                    </div>
                </th>
                <!-- <th style="min-width: 10rem">
                    <div class="flex justify-between items-center">
                        Last Modified
                        <p-columnFilter type="date" field="updatedDate" display="menu"
                            placeholder="mm/dd/yyyy"></p-columnFilter>
                    </div>
                </th> -->
                <th style="min-width: 10rem" pSortableColumn="updatedDate"><p-sortIcon field="updatedDate" />
                    Last Modified
                </th>
                <th style="min-width: 10rem; position: relative;">
                    Actions
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-category>
            <tr>
                <td>
                    {{ category.name }}
                </td>
                <td>
                    {{ category.productCount }}
                </td>
                <td>
                    <p-tag [value]="category.isActived ? 'active' : 'inactive'"
                        [severity]="getSeverity(category.isActived)" styleClass="dark:!bg-surface-900" />
                </td>
                <td>
                    {{ category.updatedDate | date: 'dd/MM/yyyy-HH:mm' }}
                </td>
                <td>
                    <p-button (click)="showEditCategoryDialog(category.id)" icon="pi pi-pencil" severity="info"
                        class="mx-2" />

                    <p-button (click)="confirmDelete($event, category)" severity="danger" [outlined]="true"
                        icon="pi pi-trash" severity="danger" class="mx-2" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="8">No categories found.</td>
            </tr>
        </ng-template>
        <ng-template #loadingbody>
            <tr>
                <td colspan="8">Loading categories data. Please wait.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<!-- toast and confirm dialog -->
<p-toast />
<p-confirmdialog />

<!-- Create category dialog -->
<p-dialog header="Create new category" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <div class="flex items-center gap-4 mb-4">
        <label for="name" class="font-normal w-24">Name</label>
        <input pInputText id="name" class="flex-auto font-normal" autocomplete="off" [(ngModel)]="categoryName" />
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="visible = false" />
        <p-button label="Save" (click)="createCategory()" />
    </div>
</p-dialog>

<!-- Edit category dialog -->
<p-dialog header="Edit Category" [modal]="true" [(visible)]="editVisible" [style]="{ width: '25rem' }">
    <div class="flex items-center gap-4 mb-4">
        <label for="editCateName" class="font-semibold w-24">Name</label>
        <input pInputText id="editCateName" [(ngModel)]="selectedCategory.name" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="isActived" class="font-semibold w-24">IsActive</label>
        <p-checkbox [(ngModel)]="selectedCategory.isActived" binary="true" inputId="isActived"></p-checkbox>
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="editVisible = false" />
        <p-button label="Save" (click)="updateCategory()" />
    </div>
</p-dialog>
