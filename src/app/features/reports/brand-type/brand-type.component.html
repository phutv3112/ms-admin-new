<div class="card summary-sold">
    <div class="flex justify-between mb-12 items-center">
        <div class="uppercase text-2xl font-semibold">Summary Stats</div>
    </div>
    <div class="">
        <div class="flex flex-col md:flex-row gap-6 my-4">
            <div class="flex flex-wrap gap-2">
                <label for="brand" class="font-semibold">Brand</label>
                <p-select [(ngModel)]="selectedBrand" [options]="brands" placeholder="Select Brand" styleClass="w-full"
                    display="chip" (onChange)="getBrandTypeStats()">
                    <ng-template let-brand #item>
                        <div class="flex items-center gap-2">
                            <div>{{ brand }}</div>
                        </div>
                    </ng-template>
                    <ng-template #dropdownicon>
                        <i class="pi pi-angle-down"></i>
                    </ng-template>
                </p-select>
            </div>
            <div class="flex flex-wrap gap-2">
                <label for="type" class="font-semibold">Type</label>
                <p-select [(ngModel)]="selectedType" [options]="types" placeholder="Select Type" styleClass="w-full"
                    display="chip" (onChange)="getBrandTypeStats()">
                    <ng-template let-type #item>
                        <div class="flex items-center gap-2">
                            <div>{{ type }}</div>
                        </div>
                    </ng-template>
                    <ng-template #dropdownicon>
                        <i class="pi pi-angle-down"></i>
                    </ng-template>
                </p-select>
            </div>
        </div>
        <div class="my-8">
            <label for="calendar-12h" class="font-bold block mb-2"> Filter Date</label>
            <p-select [(ngModel)]="filterType" [options]="filterOptions" optionLabel="label" optionValue="value"
                class="w-32 mr-2 mb-2" placeholder="Filter by" />
            <p-datepicker [(ngModel)]="date" [view]="filterType" [dateFormat]="getDateFormat()" [readonlyInput]="true"
                (onSelect)="onDateChange()" />
        </div>

    </div>
    <div class="grid grid-cols-3 gap-4">
        <div class="grid grid-cols-1 col-span-2 md:grid-cols-3 gap-4 mt-8">
            <div class="bg-surface-100 dark:bg-surface-800 p-6 rounded-xl shadow">
                <div class="font-semibold text-2xl text-gray-600 mb-2">Total Products Sold</div>
                <p-tag [value]="resultStats.totalQuantity + ''" severity="info"
                    styleClass="px-4 py-2 dark:!bg-surface-900 tag-summary" />
            </div>

            <div class="bg-surface-100 dark:bg-surface-800 p-6 rounded-xl shadow">
                <div class="font-semibold text-2xl text-gray-600 mb-2">Total Revenue</div>
                <p-tag [value]="(resultStats.totalRevenue | currency:'VND':'symbol':'1.0-0') + ''" severity="success"
                    styleClass="px-4 py-2 dark:!bg-surface-900 tag-summary" />
            </div>

            <div class="bg-surface-100 dark:bg-surface-800 p-6 rounded-xl shadow">
                <div class="font-semibold text-2xl text-gray-600 mb-2">Total Refunded</div>
                <p-tag [value]="resultStats.totalRefunded + ''" severity="warn"
                    styleClass="px-4 py-2 dark:!bg-surface-900 tag-summary" />
            </div>
        </div>

    </div>


</div>
