<div class="card">
    <div class="flex justify-between mb-4 items-center">
        <div class="uppercase text-2xl font-semibold">Top Customers</div>
        <div class="">
            <label for="calendar-12h" class="font-bold block mb-2"> Filter Date</label>
            <p-select [(ngModel)]="filterType" [options]="filterOptions" optionLabel="label" optionValue="value"
                class="w-32 mr-2 mb-2" placeholder="Filter by" />
            <p-datepicker [(ngModel)]="date" [view]="filterType" [dateFormat]="getDateFormat()" [readonlyInput]="true"
                (onSelect)="onDateChange()" />
            <button pButton label="Export Excel" icon="pi pi-file-excel" class="p-button-success ml-2"
                (click)="exportExcel(dt)"></button>
        </div>

    </div>
    <p-table #dt [value]="customers" responsiveLayout="scroll" [rows]="10" [paginator]="true">
        <ng-template #header>
            <tr>
                <th>Top#</th>
                <th pSortableColumn="buyerEmail">Email <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="totalProducts">Product quantity <p-sortIcon field="averageRating"></p-sortIcon>
                </th>
                <th pSortableColumn="totalAmount">Total Amount <p-sortIcon field="price"></p-sortIcon></th>
                <th>View</th>
            </tr>
        </ng-template>
        <ng-template #body let-customer let-index="rowIndex">
            <tr>
                <td class="w-10">
                    <p-tag [value]="'#' + (index + 1)" severity="info" styleClass="dark:!bg-surface-900" />
                </td>
                <td>
                    {{ customer.buyerEmail }}
                </td>
                <td [routerLink]="['/customers', customer.id]" class="font-semibold">
                    {{ customer.totalProducts }}
                </td>
                <td class="font-semibold">{{ customer.totalAmount | currency:'VND':'symbol':'1.0-0'}}
                </td>
                <td style="width: 15%;">
                    <button [routerLink]="['/orders/customer', customer.buyerEmail]" pButton pRipple type="button"
                        icon="pi pi-search" class="p-button p-component p-button-text p-button-icon-only"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="7">No products found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
