<div class="card">
    <div class="flex justify-between mb-4 items-center">
        <div class="uppercase text-2xl font-semibold">Orders Stats</div>
        <div class="">
            <label for="calendar-12h" class="font-bold block mb-2"> Filter Date</label>
            <p-select [(ngModel)]="filterType" [options]="filterOptions" optionLabel="label" optionValue="value"
                class="w-32 mr-2 mb-2" placeholder="Filter by" />
            <p-datepicker [(ngModel)]="date" [view]="filterType" [dateFormat]="getDateFormat()" [readonlyInput]="true"
                (onSelect)="onDateChange()" />
        </div>

    </div>
    <div class="grid grid-cols-2 gap-4">
        <p-table [value]="orderStatus" responsiveLayout="scroll" class="mt-10">
            <ng-template pTemplate="header">
                <tr>
                    <th>Status#</th>
                    <th>Status</th>
                    <th>Count</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item let-index="rowIndex">
                <tr>
                    <td class="w-10">
                        <p-tag [value]="'#' + (index + 1)" severity="info" styleClass="dark:!bg-surface-900" />
                    </td>
                    <td>
                        <p-tag [value]="item.status" [severity]="getSeverity(item.status)"
                            styleClass="dark:!bg-surface-900" />
                    </td>
                    <td class="font-semibold">{{ item.count }}</td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="2">No records found.</td>
                </tr>
            </ng-template>
        </p-table>
        <p-chart type="bar" [data]="chartData" [options]="chartOptions"></p-chart>
    </div>


</div>
