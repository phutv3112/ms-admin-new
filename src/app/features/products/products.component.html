<div class="card">
    <div class="font-semibold text-xl mb-4 flex justify-between items-center">
        <p>List Product</p>
        <div>
            <p-button routerLink="/products/create" label="+ Create new product" />
        </div>
    </div>
    <p-table #dt1 [value]="products" dataKey="id" [rows]="10" [rowHover]="true" [showGridlines]="true"
        [paginator]="true" [globalFilterFields]="['name', 'price', 'brand','type','stock']" responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                    (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Search keyword" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="min-width: 12rem" pSortableColumn="name">
                    <div class="flex justify-between items-center">
                        <span><p-sortIcon field="name" /> Name</span>
                        <p-columnFilter type="text" field="name" display="menu"
                            placeholder="Search by name"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Image
                    </div>
                </th>
                <th style="min-width: 12rem" pSortableColumn="price">
                    <div class="flex justify-between items-center">
                        <span><p-sortIcon field="price" /> Price</span>
                        <p-columnFilter type="text" field="price" display="menu"
                            placeholder="Search by price"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Brand
                        <p-columnFilter type="text" field="brand" display="menu"
                            placeholder="Search by brand"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Type
                        <p-columnFilter type="text" field="type" display="menu"
                            placeholder="Search by type"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem" pSortableColumn="stock">
                    <div class="flex justify-between items-center">
                        <span><p-sortIcon field="stock" /> Stock</span>
                        <p-columnFilter type="text" field="stock" display="menu"
                            placeholder="Search by stock"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Rating
                    </div>
                </th>
                <th style="min-width: 10rem; position: relative;">
                    Actions
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-product>
            <tr>
                <td>
                    {{ product.name }}
                </td>
                <td>
                    <img *ngIf="product.imageUrls?.length > 0; else noImage" [src]="product.imageUrls[0]?.imageUrl"
                        [alt]="product.name" class="w-24 rounded" />
                    <ng-template #noImage>
                        <span>No Image</span>
                    </ng-template>
                </td>
                <td>
                    {{ product.price }}
                </td>
                <td>
                    {{ product.brand}}
                </td>
                <td>
                    {{ product.type}}
                </td>
                <td>
                    {{ product.stock }}
                </td>
                <td>
                    rating
                </td>
                <td>
                    <p-button [routerLink]="['/products', product.id]" icon="pi pi-pencil" severity="info"
                        class="mx-2" />
                    <p-button (click)="confirmDelete($event, product.id)" severity="danger" [outlined]="true"
                        icon="pi pi-trash" severity="danger" class="mx-2" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="8">No products found.</td>
            </tr>
        </ng-template>
        <ng-template #loadingbody>
            <tr>
                <td colspan="8">Loading products data. Please wait.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<!-- toast and confirm dialog -->
<p-toast />
<p-confirmdialog />
